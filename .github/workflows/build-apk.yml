name: Auto Unzip, Build 120Hz Signed Sinhala APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto Unzip app.zip
        run: |
          if [ -f "app.zip" ]; then
            unzip -o app.zip -d .
          else
            echo "app.zip not found!"
            exit 1
          fi

      - name: Inject Auto-Update Repo & Version
        run: |
          APP_VER="1.0.${{ github.run_number }}"
          sed -i "s|__APP_VERSION__|${APP_VER}|g" www/index.html
          sed -i "s|__GITHUB_REPO__|${{ github.repository }}|g" www/index.html

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install & Sync Capacitor
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Enable Native 120Hz & Custom Icon
        run: npm run enable-120hz

      - name: Build Unsigned Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign Release APK
        run: |
          PASS="OLMaster2026Key"
          keytool -genkeypair -v \
            -keystore release.jks \
            -storetype PKCS12 \
            -alias olmaths \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=W Vihanga Rasanjana Withanage, OU=OL Master, O=OL Master, L=Sri Lanka, S=Western, C=LK"
          BUILD_TOOLS=$(ls -d ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app-aligned.apk"
          SIGNED_APK="OL-Sinhala-A-Master.apk"
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-type PKCS12 \
            --ks-key-alias olmaths \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify "$SIGNED_APK"

      - name: Publish Signed Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: O/L Sinhala A+ Master v1.0.${{ github.run_number }}
          body: "120Hz Signed Release APK"
          files: OL-Sinhala-A-Master.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

